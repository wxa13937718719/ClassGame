<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassGame</title>
    <link rel="icon" href="">
    <style>
        :root {
            --subject-primary: #00c6ff;
            --subject-secondary: #0072ff;
            --green: #2ecc71;
            --red: #e74c3c;
            --subject-ink: #1a2f44;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 18px 18px 50px;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            color: white;
            background:
                linear-gradient(135deg, rgba(10,25,47,.88), rgba(2,12,27,.73)),
                var(--subject-background-image) center / cover fixed;
        }
        button, a { font: inherit; }
        button:focus-visible, a:focus-visible { outline: 3px solid var(--subject-accent); outline-offset: 3px; }

        .top-actions {
            width: min(760px, 100%);
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .home-btn, .music-btn {
            min-height: 44px;
            border: 2px solid rgba(255,255,255,.55);
            background: rgba(255,255,255,.16);
            color: white;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 14px rgba(0,198,255,.25);
        }
        .home-btn { padding: 9px 16px; border-radius: 999px; text-decoration: none; }
        .music-btn {
            position: relative;
            width: 46px;
            border-radius: 50%;
            font-size: 21px;
        }
        .home-btn:hover, .music-btn:hover { background: rgba(0,198,255,.27); }
        .spinning { animation: spin 4s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .muted::after {
            content: "";
            position: absolute;
            left: 5px;
            top: 20px;
            width: 34px;
            height: 4px;
            border-radius: 3px;
            background: #ff5d5d;
            transform: rotate(45deg);
        }

        .header {
            width: min(760px, 100%);
            margin: 0 auto 14px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 18px;
        }
        .title-group { min-width: 0; }
        .title-group h1 { margin: 0 0 6px; font-size: clamp(24px, 4vw, 35px); text-shadow: 0 3px 12px rgba(0,198,255,.6); }
        .mode-label {
            display: inline-block;
            padding: 5px 11px;
            border-radius: 999px;
            background: rgba(0,198,255,.2);
            border: 1px solid rgba(0,198,255,.55);
            color: #dff8ff;
            font-size: 14px;
        }
        .score-board {
            flex: 0 0 auto;
            padding: 10px 17px;
            border: 1px solid rgba(255,255,255,.38);
            border-radius: 18px;
            background: rgba(255,255,255,.15);
            font-size: 20px;
            font-weight: 800;
            backdrop-filter: blur(8px);
        }
        #score { display: inline-block; transition: transform .18s, color .18s; }

        .progress-wrap { width: min(760px, 100%); margin: 0 auto 22px; }
        .progress-meta { display: flex; justify-content: flex-end; margin-bottom: 5px; font-size: 14px; }
        .progress-bar {
            height: 24px;
            border: 2px solid rgba(255,255,255,.55);
            border-radius: 999px;
            overflow: hidden;
            background: rgba(7,22,42,.84);
            box-shadow: inset 0 0 10px rgba(0,0,0,.55);
        }
        .progress-fill {
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, var(--subject-primary), var(--subject-secondary));
            box-shadow: 0 0 16px rgba(0,198,255,.8);
            transition: width .45s cubic-bezier(.4,1.8,.3,1);
        }

        .card, .empty-state {
            width: min(760px, 100%);
            margin: 0 auto;
            padding: 28px;
            border: 1px solid rgba(255,255,255,.72);
            border-radius: 22px;
            background: rgba(255,255,255,.91);
            color: var(--subject-ink);
            box-shadow: 0 0 28px rgba(0,210,255,.22), 0 18px 35px rgba(0,0,0,.28);
            backdrop-filter: blur(14px);
            animation: slideIn .4s ease-out;
        }
        @keyframes slideIn { from { transform: translateY(24px); opacity: 0; } }
        @keyframes shakeError {
            0%,100% { transform: translateX(0); }
            20%,60% { transform: translateX(-9px); }
            40%,80% { transform: translateX(9px); }
        }

        .card-tools { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
        .question-tools { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 9px; }
        .auto-remove-btn {
            border: 1px solid #43a047;
            border-radius: 999px;
            padding: 7px 13px;
            background: #edf7ee;
            color: #49614c;
            cursor: pointer;
            font-weight: 700;
        }
        .auto-remove-btn.is-on { background: #2ecc71; color: white; border-color: #219653; }
        .section-badge {
            padding: 6px 12px;
            border-radius: 999px;
            background: #e8f7ff;
            border: 1px solid #8bdcff;
            color: #0369a1;
            font-weight: 700;
            font-size: 14px;
        }
        .favorite-btn {
            border: 1px solid #e1a900;
            border-radius: 999px;
            padding: 7px 13px;
            background: #fff9db;
            color: #8a6500;
            cursor: pointer;
            font-weight: 700;
        }
        .favorite-btn.is-favorite { background: var(--subject-accent); color: #513c00; }

        .question-text {
            margin-bottom: 20px;
            font-size: clamp(19px, 3vw, 24px);
            font-weight: 800;
            line-height: 1.55;
            white-space: pre-line;
        }
        .question-img {
            display: none;
            max-width: 100%;
            max-height: 380px;
            margin: 0 auto 20px;
            border: 2px solid #dbe6ef;
            border-radius: 14px;
            object-fit: contain;
        }
        .options { display: grid; gap: 13px; }
        .option-btn {
            width: 100%;
            padding: 14px 17px;
            text-align: left;
            border: 2px solid #bcc8d3;
            border-bottom: 6px solid #aeb9c3;
            border-radius: 14px;
            background: white;
            color: #263b4e;
            cursor: pointer;
            transition: transform .1s, border-color .15s, box-shadow .15s;
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--subject-primary);
            border-bottom-color: var(--subject-secondary);
            box-shadow: 0 6px 15px rgba(0,198,255,.19);
        }
        .option-btn:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 3px; }
        .option-btn.selected:not(:disabled) {
            border-color: var(--subject-secondary);
            border-bottom-color: var(--subject-secondary);
            background: #edf6ff;
            box-shadow: 0 0 0 3px rgba(0,114,255,.10);
        }
        .option-main { display: flex; align-items: flex-start; gap: 12px; }
        .options:not(.answered) .option-label { display: none; }
        .option-label {
            flex: 0 0 31px;
            height: 31px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #eaf2f8;
            color: #205c91;
            font-weight: 900;
        }
        .option-content { padding-top: 3px; font-size: 17px; line-height: 1.5; font-weight: 700; }
        .option-image {
            display: block;
            max-width: min(320px, 100%);
            max-height: 230px;
            margin: 12px auto 0;
            border-radius: 10px;
            object-fit: contain;
        }
        .option-btn.disabled { opacity: .58; cursor: default; }
        .option-btn.correct {
            opacity: 1;
            background: var(--green);
            color: white;
            border-color: #27ae60;
            border-bottom-color: #168b49;
            animation: pop .3s ease;
        }
        .option-btn.correct .option-label { background: white; color: #168b49; }
        .option-btn.wrong {
            opacity: 1;
            background: var(--red);
            color: white;
            border-color: #c0392b;
            border-bottom-color: #922b21;
            animation: shakeError .42s ease;
        }
        .option-btn.wrong .option-label { background: white; color: #b12b20; }
        @keyframes pop { 50% { transform: scale(1.025); } }

        .answer-submit-row { display: flex; justify-content: flex-end; margin-top: 14px; }
        .submit-answer-btn {
            border: none;
            border-radius: 999px;
            padding: 12px 23px;
            background: linear-gradient(90deg, var(--subject-primary), var(--subject-secondary));
            color: white;
            cursor: pointer;
            font-weight: 800;
            box-shadow: 0 5px 15px rgba(0,114,255,.28);
        }
        .submit-answer-btn:disabled { opacity: .45; cursor: not-allowed; }
        .fill-answer-wrap { display: grid; gap: 10px; }
        .fill-answer-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #bcc8d3;
            border-radius: 12px;
            font-size: 18px;
            color: #263b4e;
            outline: none;
            background: white;
        }
        .fill-answer-input:focus { border-color: var(--subject-primary); box-shadow: 0 0 0 3px rgba(0,198,255,.12); }
        .fill-answer-input.correct { border-color: var(--green); background: #effaf2; }
        .fill-answer-input.wrong { border-color: var(--red); background: #fff1ef; }

        .answer-summary {
            margin-top: 20px;
            padding: 12px 15px;
            border-radius: 11px;
            background: #eafaf1;
            border-left: 6px solid var(--green);
            color: #19653a;
            font-weight: 800;
        }
        .explanation {
            margin-top: 12px;
            padding: 16px;
            border-radius: 12px;
            background: #fff3cd;
            border-left: 7px solid #ffc107;
            color: #725500;
            line-height: 1.65;
            white-space: pre-line;
        }
        .next-row { display: flex; justify-content: flex-end; margin-top: 20px; }
        .next-btn, .primary-btn, .secondary-btn {
            border: none;
            border-radius: 999px;
            padding: 13px 24px;
            cursor: pointer;
            font-weight: 800;
        }
        .next-btn, .primary-btn {
            background: linear-gradient(90deg, var(--subject-primary), var(--subject-secondary));
            color: white;
            box-shadow: 0 6px 17px rgba(0,114,255,.32);
        }
        .next-btn:hover, .primary-btn:hover { transform: scale(1.035); }
        .secondary-btn { background: #e9eef3; color: #33485b; }

        .empty-state { text-align: center; padding: 48px 28px; }
        .empty-state h2 { margin: 0 0 12px; font-size: 30px; }
        .empty-state p { margin: 0 0 24px; color: #5f7284; }

        .result-modal {
            position: fixed;
            inset: 0;
            z-index: 500;
            display: none;
            place-items: center;
            padding: 20px;
            background: rgba(2,12,27,.72);
            backdrop-filter: blur(8px);
        }
        .result-modal.show { display: grid; }
        .result-panel {
            width: min(480px, 100%);
            padding: 32px;
            border: 1px solid rgba(255,255,255,.78);
            border-radius: 22px;
            background: white;
            color: var(--subject-ink);
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,.38);
            animation: pop .35s ease;
        }
        .result-panel h2 { margin: 0 0 15px; font-size: 31px; }
        .result-score { margin: 0 0 10px; font-size: 34px; color: #0969da; font-weight: 900; }
        .result-detail { margin: 0 0 25px; color: #526779; }
        .result-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 11px; }

        .confetti { position: fixed; z-index: 999; pointer-events: none; animation: fall linear forwards; }
        @keyframes fall {
            from { transform: translateY(0) rotate(0); opacity: 1; }
            to { transform: translateY(145vh) rotate(720deg); opacity: 0; }
        }

        @media (max-width: 640px) {
            body { padding: 12px 10px 35px; }
            .header { align-items: center; }
            .score-board { padding: 8px 12px; font-size: 17px; }
            .card { padding: 19px 15px; border-radius: 17px; }
            .card-tools { align-items: flex-start; }
            .option-btn { padding: 12px; }
            .option-content { font-size: 16px; }
        }
    </style>
</head>
<body>
    <audio id="bgm" loop preload="auto"></audio>
    <audio id="correct-sound" preload="auto"></audio>
    <audio id="wrong-sound" preload="auto"></audio>

    <nav class="top-actions">
        <button class="home-btn" id="back-menu-btn" type="button" data-config-key="backToMenu">← 返回目录</button>
        <button class="music-btn" id="music-btn" type="button">🎵</button>
    </nav>

    <header class="header">
        <div class="title-group">
            <h1 id="chapter-title">题库加载中...</h1>
            <span class="mode-label" id="mode-label" data-config-key="chapterMode">章节闯关</span>
        </div>
        <div class="score-board">⭐ <span id="score">0</span></div>
    </header>

    <section class="progress-wrap">
        <div class="progress-meta"><span id="progress-text">0 / 0</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </section>

    <main class="card" id="game-card">
        <div class="card-tools">
            <div></div>
            <div class="question-tools">
                <button class="auto-remove-btn" id="auto-remove-btn" type="button" hidden data-config-key="autoRemoveOn">答对移除：开</button>
                <button class="favorite-btn" id="favorite-btn" type="button">☆ 收藏本题</button>
            </div>
        </div>
        <div class="question-text" id="question-text">题目加载中...</div>
        <img class="question-img" id="question-img" alt="题目配图">
        <div class="options" id="options-container"></div>
        <div class="answer-submit-row">
            <button class="submit-answer-btn" id="submit-answer-btn" type="button" hidden>提交答案</button>
        </div>
        <div class="answer-summary" id="answer-summary" hidden></div>
        <div class="explanation" id="explanation" hidden></div>
        <div class="next-row">
            <button class="next-btn" id="next-btn" type="button" hidden>继续挑战 ➜</button>
        </div>
    </main>

    <section class="empty-state" id="empty-state" hidden>
            <h2 id="empty-title">这里还没有题目</h2>
        <p id="empty-text"></p>
                <button class="primary-btn" id="empty-home-btn" type="button" data-config-key="backToMenu">返回目录</button>
    </section>

    <div class="result-modal" id="result-modal" role="dialog" aria-modal="true">
        <div class="result-panel">
            <h2 id="result-title" data-config-key="resultTitle">🎉 闯关完成！</h2>
            <div class="result-score" id="result-score">0 分</div>
            <p class="result-detail" id="result-detail"></p>
            <div class="result-actions">
                <button class="primary-btn" id="retry-btn" type="button" data-config-key="retryButton">再挑战一次</button>
                <button class="secondary-btn" id="back-home-btn" type="button" data-config-key="backToMenu">返回目录</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/validator.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
